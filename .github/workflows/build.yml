name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  # Windows libmpv (shinchiro build), mirrored as a Videoina release asset because
  # upstream deletes its daily builds after about a month.
  MPV_DEV_URL: https://github.com/Gitguy268/videoina/releases/download/deps/mpv-dev-x86_64-20261016-git-a2cd83c56d.7z
  MPV_DEV_SHA256: 0142058a8d20930f1c086d0c16a593f9e27a8b3fe9d1f4bb3b2ee4a2d5ec994b

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 ninja-build ffmpeg xvfb libfuse2
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          ctest --test-dir build --output-on-failure
          DESTDIR=$PWD/AppDir cmake --install build
      - name: AppImage
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          OUTPUT: Videoina-x86_64.AppImage
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy $base/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            -d packaging/videoina.desktop -i packaging/videoina.svg
      - name: Smoke test
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc2=duration=10:size=1280x720:rate=30 -f lavfi -i sine=duration=10 -shortest test.mkv
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./Videoina-x86_64.AppImage test.mkv --screenshot linux.png --screenshot-after 5000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux
          path: |
            Videoina-x86_64.AppImage
            linux.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: libmpv
        run: |
          Invoke-WebRequest $env:MPV_DEV_URL -OutFile mpv-dev.7z
          if ((Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash -ne $env:MPV_DEV_SHA256) { throw "libmpv checksum mismatch" }
          7z x mpv-dev.7z -ompv
          # The archive only has a MinGW import lib; build an MSVC one from the DLL's exports.
          "EXPORTS" | Out-File mpv/mpv.def -Encoding ascii
          dumpbin /nologo /exports mpv/libmpv-2.dll | Select-String '\s(mpv_\w+)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Out-File mpv/mpv.def -Append -Encoding ascii
          lib /nologo /def:mpv/mpv.def /name:libmpv-2.dll /out:mpv/mpv.lib /machine:x64
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMPV_DIR="$PWD/mpv"
          cmake --build build
          ctest --test-dir build --output-on-failure
          New-Item -ItemType Directory Videoina | Out-Null
          Copy-Item build/videoina.exe, mpv/libmpv-2.dll Videoina/
          windeployqt --release --qmldir qml --no-translations Videoina/videoina.exe
          Copy-Item LICENSE, NOTICE Videoina/
          Compress-Archive Videoina Videoina-win64.zip
      - name: Smoke test
        env:
          QT_OPENGL: software # runners have no GPU; Qt falls back to its bundled Mesa llvmpipe
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          ffmpeg -loglevel error -f lavfi -i testsrc2=duration=10:size=1280x720:rate=30 -f lavfi -i sine=duration=10 -shortest test.mkv
          $p = Start-Process Videoina/videoina.exe -ArgumentList 'test.mkv','--screenshot','windows.png','--screenshot-after','5000' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit $($p.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows
          path: |
            Videoina-win64.zip
            windows.png
          if-no-files-found: ignore

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.gitguy268.videoina.yml
          bundle: io.github.gitguy268.videoina.flatpak
          artifact-name: flatpak
          cache-key: flatpak-builder-videoina
      - run: appstreamcli validate --no-net --explain packaging/flatpak/io.github.gitguy268.videoina.metainfo.xml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes Videoina-x86_64.AppImage Videoina-win64.zip io.github.gitguy268.videoina.flatpak
