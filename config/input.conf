# Videoina key bindings: IINA's iina-default-input.conf (GPL-3.0, https://github.com/iina/iina)
# with macOS keys mapped for Windows/Linux: Ctrl+Meta+ -> Ctrl+Shift+, Meta+ -> Ctrl+.

# default input config for IINA
# customized a little bit from the mpv one

#@iina Shift+Ctrl+v video-panel
#@iina Shift+Ctrl+a audio-panel
#@iina Shift+Ctrl+s sub-panel

Ctrl+Shift+v cycle video
Ctrl+Shift+s cycle sub
Ctrl+Shift+a cycle audio

SPACE cycle pause
Ctrl+. stop

RIGHT seek  5
LEFT  seek -5
Alt+RIGHT frame-step
Alt+LEFT frame-back-step

Shift+LEFT   sub-seek -1
Shift+RIGHT  sub-seek  1

Ctrl+s screenshot

Ctrl+l ab-loop
Ctrl+L cycle-values loop "inf" "no"

#@iina Shift+Ctrl+p playlist-panel
Ctrl+RIGHT playlist-next
Ctrl+LEFT playlist-prev

#@iina Shift+Ctrl+c chapter-panel
Shift+Ctrl+> add chapter 1
Shift+Ctrl+< add chapter -1

Ctrl+[ multiply speed 0.5
Ctrl+] multiply speed 2.0
Alt+Ctrl+[ multiply speed 1/1.1
Alt+Ctrl+] multiply speed 1.1
Ctrl+\ set speed 1.0

Ctrl+0 set window-scale 0.5
Ctrl+1 set window-scale 1
Ctrl+2 set window-scale 2
#@iina Ctrl+3 fit-to-screen

#@iina Ctrl+- smaller-window
#@iina Ctrl+= bigger-window

#@iina Ctrl+Shift+p toggle-pip
#@iina Shift+Ctrl+r show-current-file-in-finder
Ctrl+Shift+f cycle fullscreen
Ctrl+Shift+t cycle ontop

#@iina Alt+Ctrl+m toggle-music-mode
#@iina Shift+Ctrl+t live-text

UP    add volume 5
DOWN  add volume -5
Alt+UP add volume 1
Alt+DOWN add volume -1

Ctrl+/ cycle mute

Shift+( add audio-delay 0.5
Shift+) add audio-delay -0.5
Alt+Shift+( add audio-delay 0.1
Alt+Shift+) add audio-delay -0.1
Shift+_ set audio-delay 0

#@iina Ctrl+D find-online-subs

Z add sub-delay -0.5
X add sub-delay 0.5
Alt+Z add sub-delay -0.1
Alt+X add sub-delay 0.1
C set sub-delay 0

ESC set fullscreen no
ENTER set fullscreen yes


# Alternative mpv key bindings

q quit

p cycle pause                          # toggle pause/playback mode

. frame-step                           # advance one frame and pause
, frame-back-step                      # go back by one frame and pause
o show-progress                        # show playback progress
P show-progress                        # show playback progress

m cycle mute

Shift+PGUP seek 600
Shift+PGDWN seek -600

G add sub-scale +0.1                   # increase the subtitle font size
F add sub-scale -0.1                   # decrease the subtitle font size

r add sub-pos -1
R add sub-pos +1
t add sub-pos +1
v cycle sub-visibility                 # hide or show the subtitles
Alt+v cycle secondary-sub-visibility   # hide or show the secondary subtitles

f cycle fullscreen                     # toggle fullscreen

E cycle edition                        # next edition

POWER quit
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
PLAYONLY set pause no
PAUSEONLY set pause yes
STOP stop
FORWARD seek 15
REWIND seek -15
NEXT playlist-next
PREV playlist-prev
VOLUME_UP add volume 2
VOLUME_DOWN add volume -2
MUTE cycle mute
CLOSE_WIN quit
